name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check src tests eval
      - run: uv run ruff format --check src tests eval
      - run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra eval --extra rag
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered

  eval-smoke:
    # Zero-token smoke test of the evaluation harness on the fixture extensions:
    # the static configuration for real, and the LLM configurations with the fake model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --extra eval
      - run: uv run python eval/run_eval.py --dataset eval/datasets/fixtures.jsonl --configs rules --offline --no-write
      - run: uv run python eval/run_eval.py --dataset eval/datasets/fixtures.jsonl --configs llm,rag_all,flat_big_model --fake-llm --offline --no-write
